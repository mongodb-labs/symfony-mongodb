name: Test

on:
    pull_request: ~
    push:
        branches:
            - "*.*"
            - "feature/*"

permissions:
    contents: read

jobs:
    test:
        name: PHP ${{ matrix.php-version }} + ${{ matrix.dependencies || 'highest' }} + Symfony ${{ matrix.symfony-require }}

        runs-on: ubuntu-latest

        services:
            mongodb_primary:
                image: mongo:8
                env:
                    MONGO_INITDB_ROOT_USERNAME: "primary"
                    MONGO_INITDB_ROOT_PASSWORD: "password"
                ports:
                    - "27017:27017"
            mongodb_secondary:
                image: mongo:8
                env:
                    MONGO_INITDB_ROOT_USERNAME: "secondary"
                    MONGO_INITDB_ROOT_PASSWORD: "password"
                ports:
                    - "27018:27018"

        continue-on-error: true

        env:
            SYMFONY_REQUIRE: ${{ matrix.symfony-require }}
            MONGODB_PRIMARY_URL: 'mongodb://primary:password@localhost:27017'
            MONGODB_SECONDARY_URL: 'mongodb://secondary:password@localhost:27018'

        strategy:
            matrix:
                php-version:
                    - '8.1'
                    - '8.2'
                    - '8.3'
                    - '8.4'
                    - '8.5'
                    - '8.6'
                symfony-require:
                    - '7.4.*'
                dependencies:
                    - 'highest'
                    - 'lowest'
                exclude:
                    # Symfony 7.4 requires PHP 8.2 or later
                    - php-version: '8.1'
                      symfony-require: '7.4.*'
                include:
                    # PHP 8.1 is tested with Symfony 6.4
                    - php-version: '8.1'
                      symfony-require: '6.4.*'
                    - php-version: '8.1'
                      symfony-require: '6.4.*'
                      dependencies: 'lowest'

                    # Every supported Symfony version is tested with PHP 8.5
                    - php-version: '8.5'
                      symfony-require: '6.4.*'
                    - php-version: '8.5'
                      symfony-require: '6.4.*'
                      dependencies: 'lowest'
                    - php-version: '8.5'
                      symfony-require: '8.1.*'
                    - php-version: '8.5'
                      symfony-require: '8.1.*'
                      dependencies: 'lowest'
                    - php-version: '8.5'
                      symfony-require: '^8@dev'

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install PHP with extensions
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-version }}
                  extensions: mongodb
                  tools: flex

            - name: Add PHPUnit matcher
              run: echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

            - name: Allow development dependencies
              if: matrix.symfony-require == '^8@dev'
              run: composer config minimum-stability dev

            - name: Install Composer dependencies (${{ matrix.dependencies || 'highest' }})
              uses: ramsey/composer-install@v3
              with:
                  dependency-versions: ${{ matrix.dependencies || 'highest' }}

            - name: Run Tests
              run: vendor/bin/simple-phpunit --configuration=phpunit.xml.dist
